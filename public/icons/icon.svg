<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF69B4"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
  </defs>
  <!-- Square background that fills entire icon -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
  <!-- Water drop / cleaning symbol - larger and centered -->
  <path d="M256 80 C256 80 130 210 130 320 C130 390 186 450 256 450 C326 450 382 390 382 320 C382 210 256 80 256 80 Z" fill="url(#dropGrad)" opacity="0.95"/>
  <!-- Sparkle 1 - top right -->
  <path d="M420 100 L432 125 L458 112 L435 130 L448 155 L425 140 L400 152 L420 135 L408 110 L428 125 Z" fill="white" opacity="0.9"/>
  <!-- Sparkle 2 - top left -->
  <path d="M90 130 L102 150 L122 140 L105 155 L115 175 L98 163 L78 172 L95 158 L85 138 L100 150 Z" fill="white" opacity="0.85"/>
  <!-- Sparkle 3 - bottom right -->
  <circle cx="400" cy="400" r="15" fill="white" opacity="0.7"/>
  <!-- Sparkle 4 - small top -->
  <circle cx="340" cy="70" r="8" fill="white" opacity="0.6"/>
  <!-- Leaf accent inside drop -->
  <ellipse cx="300" cy="300" rx="30" ry="50" fill="#4ADE80" opacity="0.5" transform="rotate(-30 300 300)"/>
</svg>
