<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF69B4"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="dropg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f4ff"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Fond dégradé plein cadre (idéal pour les icônes maskables) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Goutte épurée, centrée dans la zone de sécurité -->
  <path filter="url(#sh)" d="M256 92 C256 92 164 214 164 302 a92 92 0 0 0 184 0 C348 214 256 92 256 92 Z" fill="url(#dropg)"/>
  <!-- Reflets doux -->
  <ellipse cx="220" cy="300" rx="22" ry="38" fill="#ffffff" opacity="0.55"/>
  <circle cx="300" cy="262" r="9" fill="#ffffff" opacity="0.5"/>
</svg>
